{% extends "base.html" %}{% block content %}<div class="heading"><div><h1>Seiten</h1><p>Inhalte werden verschlüsselt in MyceliaDB-Nodes gespeichert.</p></div><a class="primary-link" href="{{ url_for('page_new') }}">+ Neue Seite</a></div><section class="panel">{% for page in pages %}<div class="row"><a href="{{ url_for('page_edit', page_id=page.id) }}"><strong>{{page.title}}</strong><span>/{{page.slug}}</span></a><em>{{page.status}}</em></div>{% else %}<p>Noch keine Seiten.</p>{% endfor %}</section>{% endblock %}
