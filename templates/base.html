<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Mycelia CMS{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/webshop-base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/cms.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/richtext.css') }}">
</head>
<body class="cms-body">
<header class="cms-top">
  <a class="brand" href="{{ url_for('dashboard') if session.get('cms_admin') else url_for('login') }}">MYCELIA <span>CMS</span></a>
  {% if session.get('cms_admin') %}
  <nav>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('pages') }}">Seiten</a>
    <a href="{{ url_for('system') }}">System</a>
    <a href="{{ url_for('webshop.public_shops') }}">Shops</a>
    <a href="{{ url_for('home') }}" target="_blank" rel="noopener noreferrer">Website</a>
    <a href="{{ url_for('ecosystem.forum') }}">Forum</a>
    <a href="{{ url_for('webshop.blog_list') }}">Blog</a>
    <form method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit">Abmelden</button>
    </form>
  </nav>
  {% endif %}
</header>
<main class="cms-main">
  {% with messages=get_flashed_messages(with_categories=true) %}
    {% for category,message in messages %}<div class="flash {{ category }}" role="alert">{{ message }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
  <script src="{{ url_for('static', filename='js/richtext.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/form-validation.js') }}" defer></script>
</body>
</html>
