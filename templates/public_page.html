{% from 'richtext/view.html' import render_richtext %}<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ page.title }}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/webshop-base.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/cms.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/richtext.css') }}"></head><body class="public-site"><header class="public-head"><a href="/">MYCELIA</a> <span>·</span> <a href="{{ url_for('webshop.public_shops') }}">Shops</a> <span>·</span> {% if shop_user %}<a href="{{ url_for('webshop.account_home') }}">Mein Konto</a>{% else %}<a href="{{ url_for('webshop.account_login') }}">Login</a>{% endif %}</header><main class="public-content"><h1>{{ page.title }}</h1>{% if page_images %}<div class="content-gallery">{% for image in page_images %}<img src="{{ url_for('media.content_image', image_id=image.id) }}" alt="Bild zu {{ page.title }}">{% endfor %}</div>{% endif %}<article>{{ render_richtext(richtext_doc(page.body, 'document')) }}</article></main></body></html>
