{% extends 'webshop/base.html' %}{% block title %}Dokumente · Mycelia{% endblock %}{% block content %}<div class="market-heading"><div><h1>Dokumentenportal</h1><p>{{ shop.name }}</p></div><a class="button" href="{{ url_for('ecosystem.document_new') }}">+ Dokument</a></div>{% for d in documents %}<a class="market-row" href="{{ url_for('ecosystem.document_edit',doc_id=d.id) }}"><div><strong>{{ d.title }}</strong><span>{{ d.visibility }} · {{ d.status }}</span></div><span>{{ d.updated_at }}</span></a>{% else %}<p>Keine Dokumente.</p>{% endfor %}{% endblock %}
