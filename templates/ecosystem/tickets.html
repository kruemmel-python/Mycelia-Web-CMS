{% extends 'webshop/base.html' %}{% block title %}Tickets · Mycelia{% endblock %}{% block content %}<h1>{{ 'Shop-Tickets' if mode=='shop' else 'Meine Support-Tickets' }}</h1>{% for t in tickets %}<a class="market-row" href="{{ url_for('ecosystem.ticket_view',ticket_id=t.id) }}"><div><strong>{{ t.subject }}</strong><span>{{ t.status }}</span></div><span>{{ t.updated_at }}</span></a>{% else %}<p>Keine Tickets.</p>{% endfor %}{% endblock %}
