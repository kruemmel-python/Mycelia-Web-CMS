{% extends 'webshop/base.html' %}{% block title %}Downloads · Mycelia{% endblock %}{% block content %}<div class="market-heading"><div><h1>Downloadportal</h1><p>{{ shop.name }}</p></div><a class="button" href="{{ url_for('ecosystem.download_new') }}">+ Datei</a></div>{% for d in downloads %}<article class="market-card"><h2>{{ d.title }}</h2><p>{{ d.filename }} · {{ d.visibility }}</p><form method="post" action="{{ url_for('ecosystem.download_delete',asset_id=d.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="danger">Löschen</button></form></article>{% else %}<p>Keine Downloads.</p>{% endfor %}{% endblock %}
